[project]
name = "recipehud"
version = "0.1.0"
description = "Kitchen recipe display kiosk: launcher, timers, clean recipe view, admin panel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.19",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "recipe-scrapers>=14.0",
    "readability-lxml>=0.8.1",
    # Imported directly by the extractor (raw JSON-LD walk, article fallback),
    # not just pulled in by the two packages above.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "segno>=1.6",
    "python-multipart>=0.0.9",
    # Defeats TLS fingerprinting on bot-blocked recipe sites (AllRecipes etc.);
    # no prebuilt wheels for 32-bit ARM, hence the marker — the extractor
    # degrades gracefully without it.
    "curl-cffi>=0.7; platform_machine != 'armv7l'",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Only scripts/screenshots.py (README images) needs this, plus a one-off
# `playwright install chromium`. The test scripts drive the system Chromium
# through scripts/_browser.py instead.
dev = ["playwright>=1.40"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
recipehud = ["schema.sql", "decks/*.json"]
